name: Deploy to VPS

on:
  push:

    branches:

      - main

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Deploy via SSH

        uses: appleboy/ssh-action@v1.0.3
        
        with:

          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            cd /opt/apps/university-management-system
            git fetch origin main
            git reset --hard origin/main
            sudo docker restart ums-api || true